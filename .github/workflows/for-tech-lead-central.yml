name: For Tech Lead - workflow central

on:
  workflow_call:
    inputs:
      actor_map:
        required: false
        type: string
        default: ''
    secrets:
      FOR_TECH_LEAD_TOKEN:
        required: false

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

jobs:
  send-pr-metrics:
    name: Enviar dados do PR fechado
    if: ${{ github.event.pull_request.state == 'closed' }}
    runs-on: ubuntu-latest

    env:
      FOR_TECH_LEAD_API: https://4techlead-backend-production-btqndx.laravel.cloud/
      FOR_TECH_LEAD_TOKEN: ${{ secrets.FOR_TECH_LEAD_TOKEN }}
      FOR_TECH_LEAD_ACTOR_MAP: ${{ inputs.actor_map }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Validar configuração
        run: |
          test -n "$FOR_TECH_LEAD_API"
          test -n "$FOR_TECH_LEAD_TOKEN"

      - name: Analisar PR e preparar webhook
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          async function main() {
            const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
            const repo = event.repository.full_name;
            const pr = event.pull_request;
            const githubToken = process.env.GH_TOKEN;
            const headSha = pr.head.sha;
            const isMerged = pr.merged === true;

            async function github(path) {
              const response = await fetch(`https://api.github.com${path}`, {
                headers: {
                  accept: 'application/vnd.github+json',
                  authorization: `Bearer ${githubToken}`,
                  'x-github-api-version': '2022-11-28',
                },
              });

              if (!response.ok) {
                console.warn(`GitHub API ${path} returned ${response.status}`);
                return null;
              }

              return response.json();
            }

            function taskRefs() {
              const text = [
                pr.title,
                pr.body ?? '',
                pr.head.ref,
                pr.base.ref,
              ].join('\n');
              const jiraLike = text.match(/\b[A-Z][A-Z0-9]+-\d+\b/g) ?? [];
              const githubIssues = [...text.matchAll(/(?:^|\s)#(\d+)\b/g)].map((match) => `#${match[1]}`);

              return [...new Set([...jiraLike, ...githubIssues])];
            }

            function storyPoints() {
              for (const label of pr.labels ?? []) {
                const name = label.name ?? '';
                const match = name.match(/\b(?:story\s*)?points?\s*[:/-]?\s*(\d+(?:\.\d+)?)\b/i)
                  ?? name.match(/\bsp\s*[:/-]?\s*(\d+(?:\.\d+)?)\b/i)
                  ?? name.match(/\bsize\s*[:/-]\s*(\d+(?:\.\d+)?)\b/i);

                if (match) {
                  return Number(match[1]);
                }
              }

              return 0;
            }

            function externalActorCode() {
              if (!process.env.FOR_TECH_LEAD_ACTOR_MAP) {
                return pr.user.login;
              }

              const actorMap = JSON.parse(process.env.FOR_TECH_LEAD_ACTOR_MAP);
              return actorMap[pr.user.login] ?? pr.user.login;
            }

            const [reviews, checks, combinedStatus] = await Promise.all([
              github(`/repos/${repo}/pulls/${pr.number}/reviews?per_page=100`),
              github(`/repos/${repo}/commits/${headSha}/check-runs?per_page=100`),
              github(`/repos/${repo}/commits/${headSha}/status`),
            ]);

            const reviewCount = Array.isArray(reviews) ? reviews.length : 0;
            const uniqueReviewerCount = Array.isArray(reviews)
              ? new Set(reviews.map((review) => review.user?.login).filter(Boolean)).size
              : 0;
            const approvalsCount = Array.isArray(reviews)
              ? reviews.filter((review) => review.state === 'APPROVED').length
              : 0;
            const changesRequestedCount = Array.isArray(reviews)
              ? reviews.filter((review) => review.state === 'CHANGES_REQUESTED').length
              : 0;
            const reworkCount = changesRequestedCount;
            const failedChecks = Array.isArray(checks?.check_runs)
              ? checks.check_runs.filter((check) => [
                'action_required',
                'cancelled',
                'failure',
                'startup_failure',
                'timed_out',
              ].includes(check.conclusion)).length
              : 0;
            const failedStatuses = Array.isArray(combinedStatus?.contexts)
              ? combinedStatus.contexts.filter((status) => ['error', 'failure'].includes(status.state)).length
              : 0;
            const ciFailures = failedChecks + failedStatuses;

            const payload = {
              event_id: `github:${repo}:pull_request:${pr.number}:${isMerged ? 'merged' : 'closed'}`,
              event_type: isMerged ? 'pull_request_merged' : 'pull_request_closed',
              external_actor_code: externalActorCode(),
              occurred_at: pr.merged_at ?? pr.closed_at,
              source_ref: `${repo}#${pr.number}`,
              payload: {
                repository: {
                  id: event.repository.id,
                  name: event.repository.name,
                  full_name: repo,
                  html_url: event.repository.html_url,
                },
                task_refs: taskRefs(),
                pull_request: {
                  number: pr.number,
                  title: pr.title,
                  url: pr.html_url,
                  author: pr.user.login,
                  author_id: pr.user.id,
                  author_association: pr.author_association,
                  merged_by: pr.merged_by?.login ?? null,
                  merged_by_id: pr.merged_by?.id ?? null,
                  head_ref: pr.head.ref,
                  base_ref: pr.base.ref,
                  head_sha: pr.head.sha,
                  base_sha: pr.base.sha,
                  state: pr.state,
                  merged: isMerged,
                  draft: pr.draft,
                  merge_commit_sha: pr.merge_commit_sha,
                  commits_count: pr.commits ?? 0,
                  review_comments_count: pr.review_comments ?? 0,
                  comments_count: pr.comments ?? 0,
                  review_count: reviewCount,
                  unique_reviewer_count: uniqueReviewerCount,
                  approvals_count: approvalsCount,
                  changes_requested_count: changesRequestedCount,
                  ci_failures_count: ciFailures,
                  rework_count: reworkCount,
                  story_points: storyPoints(),
                  changed_files: pr.changed_files ?? 0,
                  additions: pr.additions ?? 0,
                  deletions: pr.deletions ?? 0,
                  created_at: pr.created_at ?? null,
                  updated_at: pr.updated_at ?? null,
                  closed_at: pr.closed_at ?? null,
                  merged_at: pr.merged_at ?? null,
                  labels: (pr.labels ?? []).map((label) => label.name).filter(Boolean),
                  requested_reviewers: (pr.requested_reviewers ?? [])
                    .map((reviewer) => reviewer.login)
                    .filter(Boolean),
                  task_refs: taskRefs(),
                },
              },
            };

            const apiBase = process.env.FOR_TECH_LEAD_API.replace(/\/+$/, '');
            const integrationToken = process.env.FOR_TECH_LEAD_TOKEN;
            const response = await fetch(`${apiBase}/api/v1/integration-webhooks`, {
              method: 'POST',
              headers: {
                authorization: `Bearer ${integrationToken}`,
                'content-type': 'application/json',
                accept: 'application/json',
              },
              body: JSON.stringify(payload),
            });

            const body = await response.text();
            if (!response.ok) {
              console.error(body);
              process.exit(1);
            }

            console.log(body);
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
